<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2D VTT Simulation</title>
    <style>
        body {
            background-color: #1a1a24;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
        }
        #vtt-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            border: 2px solid #d4af37;
            background: #000;
            position: relative; /* For absolutely positioning the radial menu */
        }
        canvas {
            image-rendering: pixelated;
            cursor: crosshair;
        }
        #sidebar {
            width: 350px;
            margin-left: 20px;
            display: flex;
            flex-direction: column;
        }
        #combat-log {
            flex: 1;
            background: #2a2a3a;
            border: 1px solid #444;
            padding: 15px;
            overflow-y: auto;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .log-sys { color: #888; }
        .log-action { color: #d4af37; }
        .log-observe { color: #88ccff; }
        
        /* Radial Menu Styles */
        #radial-menu {
            display: none;
            position: absolute;
            width: 150px;
            background: rgba(30, 30, 40, 0.95);
            border: 1px solid #d4af37;
            border-radius: 6px;
            padding: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .radial-btn {
            display: block;
            width: 100%;
            background: none;
            border: none;
            color: #fff;
            padding: 8px;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid #444;
        }
        .radial-btn:last-child { border-bottom: none; }
        .radial-btn:hover { background: #d4af37; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div id="vtt-container">
        <canvas id="dungeonCanvas"></canvas>
        <div id="radial-menu"></div>
    </div>

    <div id="sidebar">
        <h2 style="color: #d4af37; margin-top: 0;">Event Log</h2>
        <div id="combat-log">
            <div class="log-entry log-sys">System: Awaiting dungeon_state.json...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('dungeonCanvas');
        const ctx = canvas.getContext('2d');
        const log = document.getElementById('combat-log');
        const radialMenu = document.getElementById('radial-menu');
        
        const TILE_SIZE = 24; // 24px per 5ft square
        let dungeonData = null;

        function logEvent(text, type = 'action') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = text;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        async function loadDungeon() {
            try {
                const response = await fetch('dungeon_state.json');
                dungeonData = await response.json();
                
                canvas.width = dungeonData.Width * TILE_SIZE;
                canvas.height = dungeonData.Height * TILE_SIZE;
                
                logEvent("System: Dungeon loaded successfully.", "sys");
                renderMap();
            } catch (err) {
                logEvent("System Error: Could not load dungeon_state.json. Did you run the Go generator?", "sys");
                console.error(err);
            }
        }

        function renderMap() {
            if (!dungeonData) return;

            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < dungeonData.Height; y++) {
                for (let x = 0; x < dungeonData.Width; x++) {
                    const tile = dungeonData.Grid[y][x]; 
                    
                    if (tile === 35) { // '#' (Wall)
                        ctx.fillStyle = '#333';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    } else if (tile === 46 || tile === 43 || tile === 79) { // '.', '+', 'O' (Floor base)
                        ctx.fillStyle = '#555';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#444';
                        ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // Draw Doors over floors
            for (const key in dungeonData.Doors) {
                const [strX, strY] = key.split(',');
                const x = parseInt(strX);
                const y = parseInt(strY);
                const door = dungeonData.Doors[key];

                if (!door.IsOpen) {
                    ctx.fillStyle = '#8B4513'; // SaddleBrown for closed doors
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else {
                    ctx.fillStyle = '#4A250A'; // Dark brown for open doors
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        // --- INTERACTION LOGIC ---

        // Left Click: Observe (DM read-aloud)
        canvas.addEventListener('click', (e) => {
            radialMenu.style.display = 'none'; // Hide menu on left click
            if (!dungeonData) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            
            const tile = dungeonData.Grid[y][x];
            const doorKey = `${x},${y}`;
            
            let desc = "You see a section of floor.";
            if (tile === 35) desc = "You see a section of rough stone wall.";
            if (dungeonData.Doors[doorKey]) {
                const door = dungeonData.Doors[doorKey];
                desc = `You see a ${door.Material.toLowerCase()} door. It is ${door.IsOpen ? "open" : "closed"}.`;
            }

            logEvent(`Observe (${x}, ${y}): ${desc}`, "observe");
        });

        // Right Click: Radial Action Menu
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault(); 
            if (!dungeonData) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            
            const doorKey = `${x},${y}`;
            const door = dungeonData.Doors[doorKey];
            const tile = dungeonData.Grid[y][x];

            radialMenu.innerHTML = ''; // Clear old buttons
            
            // Build Context Actions
            let actions = [];
            
            if (door) {
                actions.push({ name: "Inspect Door", log: `You inspect the ${door.Material} door.` });
                if (!door.IsOpen) {
                    actions.push({ name: "Open Door", log: `You attempt to open the door.` });
                    if (door.Lock !== 0) actions.push({ name: "Pick Lock", log: `You attempt to pick the lock.` });
                    actions.push({ name: "Bash Door", log: `You violently bash the door.` });
                } else {
                    actions.push({ name: "Close Door", log: `You close the door.` });
                }
            } else if (tile === 46) { // Floor
                actions.push({ name: "Move Here", log: `You move to (${x}, ${y}).` });
                actions.push({ name: "Search Tile", log: `You search the floor at (${x}, ${y}).` });
            } else if (tile === 35) { // Wall
                actions.push({ name: "Search Wall", log: `You search the wall at (${x}, ${y}).` });
            }

            if (actions.length === 0) return;

            // Populate Menu
            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'radial-btn';
                btn.textContent = action.name;
                btn.onclick = () => {
                    logEvent(`[Action] ${action.log}`, "action");
                    radialMenu.style.display = 'none';
                    // Trigger Go WASM mechanics here later
                };
                radialMenu.appendChild(btn);
            });

            // Position and show menu
            radialMenu.style.left = `${e.clientX}px`;
            radialMenu.style.top = `${e.clientY}px`;
            radialMenu.style.display = 'block';
        });

        // Close menu if clicking outside
        document.addEventListener('click', (e) => {
            if (e.target !== canvas && !radialMenu.contains(e.target)) {
                radialMenu.style.display = 'none';
            }
        });

        loadDungeon();
    </script>
</body>
</html>
